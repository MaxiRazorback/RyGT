name: RyGT Windows build

on:
  push:
    branches: [development]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Runtime libraries and converter (Windows x64)
    runs-on: windows-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ccache
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            curl
            unzip
            zip

      - name: Cache C++ compilation results
        uses: actions/cache@v4
        with:
          path: .ccache
          key: windows-ucrt64-ccache-${{ hashFiles('**/CMakeLists.txt', '**/*.cpp', '**/*.h', '**/*.hpp', '**/*.c', '**/*.cc') }}
          restore-keys: |
            windows-ucrt64-ccache-

      - name: Reset compiler cache statistics
        run: ccache --zero-stats

      - name: Get pinned FFmpeg revision
        id: ffmpeg
        run: |
          set -euo pipefail
          expected="$(git ls-tree HEAD 3rdparty/ffmpeg-core | awk '{print $3}')"
          actual="$(git -C 3rdparty/ffmpeg-core rev-parse HEAD)"
          if [ ! -f 3rdparty/ffmpeg-core/CMakeLists.txt ]; then
            echo "FFmpeg submodule is missing; check recursive checkout."
            exit 1
          fi
          if [ "$actual" != "$expected" ]; then
            echo "FFmpeg submodule HEAD ($actual) does not match pinned commit ($expected)."
            exit 1
          fi
          echo "sha=${expected:0:12}" >> "$GITHUB_OUTPUT"

      - name: Cache FFmpeg prebuilt libraries
        uses: actions/cache@v4
        with:
          path: build/windows-mingw/externals/ffmpeg-${{ steps.ffmpeg.outputs.sha }}
          key: windows-ffmpeg-${{ steps.ffmpeg.outputs.sha }}

      - name: Download FFmpeg prebuilt libraries
        env:
          FFMPEG_REVISION: ${{ steps.ffmpeg.outputs.sha }}
        run: |
          set -euo pipefail
          package="build/windows-mingw/externals/ffmpeg-$FFMPEG_REVISION"
          if [ ! -f "$package/include/libavcodec/avcodec.h" ]; then
            archive="build/windows-mingw/externals/$FFMPEG_REVISION-ffmpeg-mingw-x64.zip"
            mkdir -p "$(dirname "$package")"
            curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 \
              "https://github.com/KytyPS5/ext-ffmpeg-core/releases/download/$FFMPEG_REVISION/ffmpeg-mingw-x64.zip" \
              --output "$archive"
            mkdir -p "$package"
            unzip -q "$archive" -d "$package"
            test -f "$package/include/libavcodec/avcodec.h"
          fi

      - name: Configure
        env:
          FFMPEG_REVISION: ${{ steps.ffmpeg.outputs.sha }}
        run: >-
          cmake -S . -B build/windows-mingw -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING:BOOL=OFF
          -DRTY_ENABLE_LTO=OFF
          -DRTY_BUILD_GUI=OFF
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DFFMPEG_PREBUILT_DIR="$PWD/build/windows-mingw/externals/ffmpeg-$FFMPEG_REVISION"

      - name: Build RyGT runtime and converter
        run: cmake --build build/windows-mingw --parallel --target libs ryty

      - name: Show compiler cache statistics
        run: ccache --show-stats

      - name: Build launcher
        shell: pwsh
        run: |
          $stage = Join-Path $env:GITHUB_WORKSPACE 'RyGT-windows-x86_64'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          & .\loader\build.cmd $stage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Assemble Windows app artifact
        run: |
          set -euo pipefail
          stage="RyGT-windows-x86_64"
          mkdir -p "$stage/libs" "$stage/converter" "$stage/launcher"
          find build/windows-mingw/core/libs/libs -maxdepth 1 -type f -name '*.prx' -exec cp {} "$stage/libs/" \;
          cp build/windows-mingw/core/relinker/ryty.exe "$stage/converter/"
          cp loader/launcher/background.png "$stage/launcher/"
          cp /ucrt64/bin/libgcc_s_seh-1.dll "$stage/"
          cp /ucrt64/bin/libstdc++-6.dll "$stage/"
          cp /ucrt64/bin/libwinpthread-1.dll "$stage/"
          cp /ucrt64/bin/libgcc_s_seh-1.dll "$stage/converter/"
          cp /ucrt64/bin/libstdc++-6.dll "$stage/converter/"
          cp /ucrt64/bin/libwinpthread-1.dll "$stage/converter/"
          test -f "$stage/RyGT.exe"
          test -n "$(find "$stage/libs" -maxdepth 1 -name '*.prx' -print -quit)"
          cat > "$stage/README.txt" <<'EOF'
          RyGT Windows test build

          Run RyGT.exe to open the launcher. It builds the launcher, converter, and RyGT runtime
          libraries from this repository. The included launcher background is in launcher/.

          To play, you also need your own decrypted GT Sport CUSA03220 update 1.69 dump and PS4
          firmware modules and fonts. The Vulkan renderer and AMD FSR library are not built here;
          obtain them from a RyGT release or build shadGT as documented in the repository README.

          See docs/gt-sport/README.md in the RyGT repository for setup instructions.
          EOF
          zip -qr RyGT-windows-x86_64.zip "$stage"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: RyGT-windows-x86_64
          path: RyGT-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 14
